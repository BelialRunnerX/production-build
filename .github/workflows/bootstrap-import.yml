name: Bootstrap Production Import

on:
  push:
    branches: [ main ]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct production tree
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.bootstrap/payload.part*.b64' > /dev/null; then
            cat .bootstrap/payload.part*.b64 | base64 --decode > /tmp/elysium-production.tar.xz
          elif [ -f .bootstrap/production-source.tar.xz ]; then
            cp .bootstrap/production-source.tar.xz /tmp/elysium-production.tar.xz
          else
            echo 'No bootstrap production payload found.' >&2
            exit 1
          fi
          mkdir -p /tmp/elysium-production
          tar -xJf /tmp/elysium-production.tar.xz -C /tmp/elysium-production
          rsync -a --delete --exclude='.git/' /tmp/elysium-production/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Verify recovered C++ inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_production_sources.py
          git diff --exit-code -- cmake/ProductionSources.cmake
          runtime=$(find src -name '*.cpp' -type f | wc -l)
          tests=$(find tests -name '*.cpp' -type f | wc -l)
          tools=$(find tools -name '*.cpp' -type f | wc -l)
          total=$((runtime + tests + tools))
          echo "runtime=$runtime tests=$tests tools=$tools total=$total"
          test "$runtime" -eq 1588
          test "$tests" -eq 22
          test "$tools" -eq 2
          test "$total" -eq 1612

      - name: Commit production source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Elysium production-ready 1612-file build'
          git push origin HEAD:main
